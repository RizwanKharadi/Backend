apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Add this line for react-native-config
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// react-native-vector-icons
// project.ext.vectoricons = [
//     iconFontsDir  : "../../node_modules/react-native-vector-icons/Fonts",
//     iconFontNames : [ "*.ttf" ]
// ]

// // Bundle react-native-vector-icons fonts on Android
// apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
// import com.android.build.OutputFile
// import org.apache.tools.ant.taskdefs.condition.Os

def enableHermes = true
def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    namespace "com.finsync360"
    defaultConfig {
        applicationId "com.finsync360"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        
        // This is important for react-native-config
        resValue "string", "build_config_package", "com.finsync360"

        // react-native-camera defines product flavors (general/mlkit). We must choose one.
        // 'general' keeps minSdk 21 compatibility.
        missingDimensionStrategy "react-native-camera", "general"
    }

        signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-android:0.73.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"

    if (enableHermes) {
        implementation("com.facebook.react:hermes-android:0.73.2")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// Skip reanimated version check task
project.tasks.whenTaskAdded { task ->
    if (task.name == 'assertMinimalReactNativeVersionTask') {
        task.enabled = false
    }
}

task copyDownloadableDepsToLibs(type: Copy) {
    from configurations.implementation
    into 'libs'
}
