# Local MySQL 8 for FinSync360 (Phase 1 — no Hostinger yet)
# Usage: docker compose -f docker-compose.mysql.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: finsync360-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: finsync360
      MYSQL_USER: finsync
      MYSQL_PASSWORD: finsyncpass
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - finsync360_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  finsync360_mysql_data:
