# Nginx site for TallyFin backend on Hostinger VPS (Ubuntu 24.04)
#
# Install:
#   sudo cp deployment/nginx-tallyfin.conf /etc/nginx/sites-available/tallyfin
#   sudo ln -sf /etc/nginx/sites-available/tallyfin /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo sed -i 's/api.YOURDOMAIN.com/api.yourrealdomain.com/g' /etc/nginx/sites-available/tallyfin
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yourrealdomain.com
#
# Certbot rewrites this file in place to add the TLS listener and the
# HTTP->HTTPS redirect. Do not hand-edit those blocks afterwards.
#
# Replace api.YOURDOMAIN.com before use.

# Only send "Connection: upgrade" for real WebSocket handshakes. Sending it on
# every request breaks upstream keepalive and confuses plain HTTP requests.
map $http_upgrade $tallyfin_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tallyfin_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.YOURDOMAIN.com;

    # Matches MAX_FILE_SIZE=10485760 in backend/.env with headroom for
    # multipart overhead.
    client_max_body_size 20m;

    # Do not advertise the nginx version.
    server_tokens off;

    access_log /var/log/nginx/tallyfin.access.log;
    error_log  /var/log/nginx/tallyfin.error.log;

    # Desktop-agent Tally WebSocket (backend/src/server.js -> '/tally-agent').
    # Long-lived: agents stay connected for hours between sync batches.
    location /tally-agent {
        proxy_pass http://tallyfin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tallyfin_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Socket.IO realtime channel for the mobile app (default path).
    location /socket.io/ {
        proxy_pass http://tallyfin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tallyfin_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Everything else: normal REST API traffic.
    location / {
        proxy_pass http://tallyfin_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tallyfin_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tally XML pulls and large report queries can be slow.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
