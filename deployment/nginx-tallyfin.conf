# Nginx site for FinSync360 on Hostinger VPS
# Install:
#   sudo cp deployment/nginx-finsync360.conf /etc/nginx/sites-available/finsync360
#   sudo ln -sf /etc/nginx/sites-available/finsync360 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.YOURDOMAIN.com
#
# Replace api.YOURDOMAIN.com before use.

upstream finsync_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.YOURDOMAIN.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://finsync_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
